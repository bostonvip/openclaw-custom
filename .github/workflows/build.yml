name: Build Custom OpenClaw Image

on:
  # Daily check at 06:00 UTC for new stable releases
  schedule:
    - cron: "0 6 * * *"

  # On-demand trigger from GitHub UI or API
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even if base version hasn't changed"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      version_override:
        description: "Pin to a specific OpenClaw version (e.g. 2026.3.7). Leave empty for latest stable."
        required: false
        default: ""
        type: string

  # Rebuild when the Dockerfile itself changes
  push:
    branches: [main]
    paths:
      - "Dockerfile"

env:
  REGISTRY: ghcr.io
  UPSTREAM_IMAGE: ghcr.io/openclaw/openclaw

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image name
        run: echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ github.repository_owner }}/openclaw-custom" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest stable OpenClaw release
        id: release
        run: |
          OVERRIDE="${{ github.event.inputs.version_override }}"
          if [ -n "$OVERRIDE" ]; then
            echo "version=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using manual override: $OVERRIDE"
          else
            TAG_NAME=$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/openclaw/openclaw/releases/latest \
              | jq -r '.tag_name')
            VERSION="${TAG_NAME#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Latest stable release: $VERSION (git tag: $TAG_NAME)"
          fi

      - name: Fetch latest supercronic release
        id: supercronic
        run: |
          TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aptible/supercronic/releases/latest \
            | jq -r '.tag_name')
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest supercronic release: $TAG"

      - name: Verify upstream container tag exists
        id: verify
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if docker manifest inspect "${{ env.UPSTREAM_IMAGE }}:${VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Verified: ${{ env.UPSTREAM_IMAGE }}:${VERSION} exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Container tag ${{ env.UPSTREAM_IMAGE }}:${VERSION} not found — skipping build"
          fi

      - name: Inspect base image for entrypoint and command
        id: base_inspect
        if: steps.verify.outputs.exists == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          BASEIMAGE="${{ env.UPSTREAM_IMAGE }}:${VERSION}"
          
          echo "Pulling base image: $BASEIMAGE"
          docker pull "$BASEIMAGE"
          
          # Extract entrypoint (array joined with spaces)
          EP=$(docker inspect "$BASEIMAGE" \
            --format '{{range .Config.Entrypoint}}{{.}} {{end}}' | sed 's/[[:space:]]*$//')
          
          # Extract command (array joined with spaces)
          CMD=$(docker inspect "$BASEIMAGE" \
            --format '{{range .Config.Cmd}}{{.}} {{end}}' | sed 's/[[:space:]]*$//')
          
          # Provide defaults if empty (shouldn't happen with official image)
          EP="${EP:-docker-entrypoint.sh}"
          CMD="${CMD:-node /app/dist/index.js}"
          
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          
          echo "Captured entrypoint: $EP"
          echo "Captured command:    $CMD"

      - name: Get previous base version from our latest image
        id: previous
        if: steps.verify.outputs.exists == 'true'
        run: |
          if docker pull "$IMAGE_NAME:latest" 2>/dev/null; then
            PREV_VERSION=$(docker inspect "$IMAGE_NAME:latest" \
              --format='{{index .Config.Labels "org.openclaw.base-version"}}' 2>/dev/null || echo "")
            echo "version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
            echo "Previous base version: ${PREV_VERSION:-<none>}"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No previous image found — first build"
          fi

      - name: Decide whether to build
        id: decision
        if: steps.verify.outputs.exists == 'true'
        run: |
          FORCE="${{ github.event.inputs.force_build || 'false' }}"
          EVENT="${{ github.event_name }}"
          LATEST="${{ steps.release.outputs.version }}"
          PREV="${{ steps.previous.outputs.version }}"

          if [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Force build requested" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Dockerfile changed" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREV" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=No previous build found" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST" != "$PREV" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=New upstream release ($PREV → $LATEST)" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "reason=Already on latest ($LATEST)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            OPENCLAW_VERSION=${{ steps.release.outputs.version }}
            OPENCLAW_EP=${{ steps.base_inspect.outputs.ep }}
            OPENCLAW_CMD=${{ steps.base_inspect.outputs.cmd }}
            SUPERCRONIC_VERSION=${{ steps.supercronic.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          labels: |
            org.openclaw.base-version=${{ steps.release.outputs.version }}
            org.openclaw.build-reason=${{ steps.decision.outputs.reason }}
            org.openclaw.build-date=${{ github.run_started_at }}
            org.openclaw.supercronic-version=${{ steps.supercronic.outputs.version }}
            org.openclaw.includes-vscode-tunnel=true
            org.openclaw.includes-cron=true
            org.openclaw.baked-entrypoint=${{ steps.base_inspect.outputs.ep }}
            org.openclaw.baked-cmd=${{ steps.base_inspect.outputs.cmd }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### Build Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verify.outputs.exists }}" != "true" ]; then
            echo "⚠️ **Skipped** — container tag \`${{ env.UPSTREAM_IMAGE }}:${{ steps.release.outputs.version }}\` not found yet" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.decision.outputs.build }}" = "true" ]; then
            echo "✅ **Built and pushed** — ${{ steps.decision.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Image: \`${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- OpenClaw version: \`${{ steps.release.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Baked EP: \`${{ steps.base_inspect.outputs.ep }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Baked CMD: \`${{ steps.base_inspect.outputs.cmd }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Supercronic: \`${{ steps.supercronic.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- VS Code tunnel: \`enabled\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ **Skipped** — ${{ steps.decision.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          fi
