name: Build Custom OpenClaw Image

on:
  # Daily check at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"

  # On-demand trigger from GitHub UI or API
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even if base image hasn't changed"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Rebuild when the Dockerfile itself changes
  push:
    branches: [main]
    paths:
      - "Dockerfile"

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/openclaw/openclaw:main
  # IMAGE_NAME is set dynamically from the repo name (e.g., ghcr.io/yourusername/openclaw-custom)

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ github.repository_owner }}/openclaw-custom" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image and get digest
        id: base
        run: |
          docker pull "$BASE_IMAGE"
          BASE_DIGEST=$(docker inspect "$BASE_IMAGE" --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base image digest: $BASE_DIGEST"

      - name: Get previous base digest from our latest image
        id: previous
        run: |
          # Try to pull our existing image to read its label
          if docker pull "$IMAGE_NAME:latest" 2>/dev/null; then
            PREV_DIGEST=$(docker inspect "$IMAGE_NAME:latest" --format='{{index .Config.Labels "org.openclaw.base-digest"}}' 2>/dev/null || echo "")
            echo "digest=$PREV_DIGEST" >> "$GITHUB_OUTPUT"
            echo "Previous base digest: $PREV_DIGEST"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "No previous image found — first build"
          fi

      - name: Decide whether to build
        id: decision
        run: |
          FORCE="${{ github.event.inputs.force_build || 'false' }}"
          EVENT="${{ github.event_name }}"
          BASE="${{ steps.base.outputs.digest }}"
          PREV="${{ steps.previous.outputs.digest }}"

          if [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Force build requested" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Dockerfile changed" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREV" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=No previous build found" >> "$GITHUB_OUTPUT"
          elif [ "$BASE" != "$PREV" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Base image updated ($PREV → $BASE)" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "reason=Base image unchanged" >> "$GITHUB_OUTPUT"
          fi

          echo "Decision: $(cat "$GITHUB_OUTPUT" | grep reason | cut -d= -f2)"

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.openclaw.base-digest=${{ steps.base.outputs.digest }}
            org.openclaw.build-reason=${{ steps.decision.outputs.reason }}
            org.openclaw.build-date=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Build Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.decision.outputs.build }}" = "true" ]; then
            echo "✅ **Built and pushed** — ${{ steps.decision.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Image: \`${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Base digest: \`${{ steps.base.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ **Skipped** — ${{ steps.decision.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          fi
